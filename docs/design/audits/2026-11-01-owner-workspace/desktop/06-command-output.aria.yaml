        - text: Comandos y resultados guardados
        - paragraph: Esta consulta conserva los recibos y no repite comandos. Está disponible aunque la ejecución se haya detenido.
        - paragraph: 1 comandos registrados
        - list:
          - listitem:
            - paragraph: python3.12 · contexto 1
            - paragraph: Código de salida 0
            - paragraph: Cierre local registrado
            - paragraph: 95 bytes de salida · 0 de errores
