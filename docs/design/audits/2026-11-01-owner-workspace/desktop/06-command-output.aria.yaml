        - button "Comandos anteriores" [disabled]
        - button "Siguientes comandos" [disabled]
        - button "Consultar lista"
        - region "Salida del comando seleccionado":
          - region "Recibo del comando":
            - heading "python3.12 · contexto 1" [level=4]
            - paragraph: Código de salida 0
            - paragraph: Cierre local registrado
            - paragraph: El código de salida y el cierre registrado son hechos distintos. No confirman la validez del análisis ni la aceptación de la tarea.
            - paragraph: La salida se guarda al terminar o perder seguimiento del comando. Mientras trabaja puede estar vacía. Consultarla no repite el comando.
            - group: Argumentos y límites registrados
            - region "Salida estándar":
              - heading "Salida estándar" [level=5]
              - paragraph: Bytes 1–95 de 95 guardados
              - text: base=137; rate=0.21; tax_exact=28.77; policy_total=165.77; code_total=137.21; difference=28.56
              - group: Bytes originales de esta ventana (base64)
              - button "Inicio de salida estándar" [disabled]: Inicio
              - button "Bytes anteriores de salida estándar" [disabled]: Anterior
              - button "Bytes siguientes de salida estándar" [disabled]: Siguiente
              - button "Últimos bytes de salida estándar" [disabled]: Últimos bytes
            - region "Salida de errores":
              - heading "Salida de errores" [level=5]
              - paragraph: Sin bytes en esta ventana · 0 guardados
              - button "Inicio de salida de errores" [disabled]: Inicio
              - button "Bytes anteriores de salida de errores" [disabled]: Anterior
              - button "Bytes siguientes de salida de errores" [disabled]: Siguiente
              - button "Últimos bytes de salida de errores" [disabled]: Últimos bytes
            - button "Consultar recibo"
      - region "Propuesta del agente":
        - heading "Propuesta" [level=4]
        - paragraph:
          - strong: "Fuente:"
          - text: capturé
          - code: "`policy.md`"
          - text: como fuente 1. Indica tasas fraccionarias y redondeo final
          - code: "`ROUND_HALF_UP`"
          - text: . Usé su ejemplo de tasa
          - strong: 0,21
          - text: ; el documento no establece una tasa obligatoria.
        - paragraph:
          - strong: "Resultado ejecutado:"
          - code: "`researcher_python`"
          - text: ", con clave"
          - code: "`calculate-policy`"
          - text: ", calculó para base 137: impuesto"
          - strong: 28,77
          - text: y total
          - strong: 165,77
          - text: ". Leí el job hasta su recibo terminal: código 0, ejecución cerrada y salida completa."
        - paragraph:
          - strong: "Interpretación:"
          - text: Ken leyó
          - code: "`invoice.py`"
          - text: ": devuelve"
          - code: "`subtotal + tax_rate`"
          - text: . Evaluar esa expresión da
          - strong: 137,21
          - text: ", es decir,"
          - strong: 28,56 menos
          - text: ": suma la tasa directamente y no aplica el redondeo anunciado."
        - paragraph:
          - text: No edité archivos, ejecuté tests, publiqué ni acepté la tarea. Guardé el informe draft con cita de la fuente, clave
          - code: "`analysis-report`"
          - text: .
        - paragraph:
          - strong: "ID del informe: 1"
          - text: .
