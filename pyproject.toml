[build-system]
requires = ["setuptools>=74.1,<85"]
build-backend = "setuptools.build_meta"

[project]
name = "researcher"
version = "0.1.0"
description = "A local research and development workspace with recoverable agent execution."
readme = "README.md"
# Retain the existing Python range until the native/kernel version matrix is verified.
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.162.0,<1",
    "uvicorn[standard]>=0.54.0,<1",
    "pydantic>=2.12.5,<3",
    "pydantic-settings>=2.16.2,<3",
    "httpx>=0.28.1,<1",
    "mcp>=1.30.0,<2",
    "jsonschema>=4.26.0,<5",
    "referencing>=0.37.0,<1",
    "requests>=2.34.2,<3",
    "click>=8.5.0,<9",
    "numpy>=2.5.4,<3",
    "onnxruntime>=1.31.1,<2",
    "tokenizers>=0.23.3,<1",
    "huggingface-hub>=1.33.0,<2",
    "pypdf>=6.21.4,<7",
    "defusedxml>=0.7.1,<1",
    "ddgs>=9.16.1,<10",
    "trafilatura>=2.3.1,<3",
    "textual>=8.2.8,<9",
    "watchfiles>=1.3.0,<2",
]

[project.optional-dependencies]
# Historical schema/tool inspection only; this does not enable an inference backend.
legacy = [
    "crewai==1.15.33",
    "crewai-tools==1.15.33",
    "litellm>=1.106.6,<2",
    "ollama>=0.6.3,<1",
    "chromadb>=1.5.9,<2",
    "tree-sitter>=0.26.0,<0.27",
    "tree-sitter-python>=0.25.0,<0.26",
    "tree-sitter-javascript>=0.25.0,<0.26",
    "tree-sitter-typescript>=0.23.2,<0.24",
    "tree-sitter-c>=0.24.1,<0.25",
    "tree-sitter-rust>=0.24.2,<0.25",
]
spider = ["spider-client>=0.1.0"]

[dependency-groups]
dev = [
    "pytest>=9.2.0,<10",
    "pytest-asyncio>=1.4.1,<2",
    "pytest-socket>=0.7.0,<1",
    "pytest-timeout>=2.4.0,<3",
    "ruff>=0.15.0,<1",
]

[project.scripts]
researcher = "backend.cli.main:main"
researcher-bootstrap = "backend.cli.bootstrap:main"
researcher-mcp = "backend.research.stdio_server:main"

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.setuptools.package-data]
backend = ["db/*.sql"]

[[tool.setuptools.ext-modules]]
name = "backend.runtime._domain_spawn"
sources = ["backend/runtime/_domain_spawn.c"]
extra-compile-args = ["-Wall", "-Wextra", "-Werror", "-std=c11"]

[tool.ruff]
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--disable-socket --allow-unix-socket --timeout=20"
markers = ["live: explicit bounded tests against a real runtime or external service"]
filterwarnings = [
    "ignore::DeprecationWarning:crewai.*",
    "ignore::PendingDeprecationWarning:crewai.*",
]
