[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "researcher"
version = "0.1.0"
description = "A local research and development workspace with recoverable agent execution."
readme = "README.md"
# CrewAI is transitional; its currently installed release excludes Python 3.14.
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.162.0,<1",
    "uvicorn[standard]>=0.54.0,<1",
    "pydantic>=2.12.5,<3",
    "pydantic-settings>=2.16.2,<3",
    "httpx>=0.28.1,<1",
    "mcp>=1.30.0,<2",
    "requests>=2.34.2,<3",
    "click>=8.5.0,<9",
    "numpy>=2.5.4,<3",
    "pypdf>=6.21.4,<7",
    "ddgs>=9.16.1,<10",
    "trafilatura>=2.3.1,<3",
    # Retained until consumers migrate to the selected runtime and Ken.
    "crewai==1.15.33",
    "crewai-tools==1.15.33",
    "litellm>=1.106.6,<2",
    "ollama>=0.6.3,<1",
    "chromadb>=1.5.9,<2",
    "textual>=8.2.8,<9",
    "watchfiles>=1.3.0,<2",
    "tree-sitter>=0.26.0,<0.27",
    "tree-sitter-python>=0.25.0,<0.26",
    "tree-sitter-javascript>=0.25.0,<0.26",
    "tree-sitter-typescript>=0.23.2,<0.24",
    "tree-sitter-c>=0.24.1,<0.25",
    "tree-sitter-rust>=0.24.2,<0.25",
]

[project.optional-dependencies]
anthropic = ["crewai[anthropic]==1.15.33"]
gemini = ["crewai[google-genai]==1.15.33"]
spider = ["spider-client>=0.1.0"]

[dependency-groups]
dev = [
    "pytest>=9.2.0,<10",
    "pytest-asyncio>=1.4.1,<2",
    "pytest-socket>=0.7.0,<1",
    "pytest-timeout>=2.4.0,<3",
    "ruff>=0.15.0,<1",
]

[project.scripts]
researcher = "backend.cli.main:main"

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.setuptools.package-data]
backend = ["db/*.sql"]

[tool.ruff]
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--disable-socket --allow-unix-socket --timeout=20"
markers = ["live: explicit bounded tests against a real runtime or external service"]
filterwarnings = [
    "ignore::DeprecationWarning:crewai.*",
    "ignore::PendingDeprecationWarning:crewai.*",
]
