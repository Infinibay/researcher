[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "researcher"
version = "0.1.0"
requires-python = ">=3.11"

[project.scripts]
researcher = "backend.cli.main:main"

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning:crewai.*",
    "ignore::PendingDeprecationWarning:crewai.*",
]
