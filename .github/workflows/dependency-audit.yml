name: Dependency audit

on:
  pull_request:
    paths:
      - 'pyproject.toml'
      - 'uv.lock'
      - 'requirements*.txt'
      - 'requirements*.in'
      - 'scripts/**'
      - 'frontend/package*.json'
      - '.github/**'
  schedule:
    - cron: '17 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.6'
          python-version: '3.12'
          enable-cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.2'
      - name: Check product lock and generated requirements
        run: |
          uv lock --check
          uv export --locked --no-dev --no-emit-project --format requirements-txt --output-file requirements.txt
          git diff --exit-code -- requirements.txt
      - name: Audit all locks and inventory declared licenses
        if: ${{ !cancelled() }}
        run: uv run --no-project --python 3.12 scripts/audit_dependencies.py --output dependency-reports --licenses
      - name: Retain findings even when an audit fails
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-reports
          path: dependency-reports/
          if-no-files-found: error
          retention-days: 30
